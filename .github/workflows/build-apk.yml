name: Build IRmAPI APK

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libtool autoconf automake pkg-config zip unzip

      - name: Install buildozer
        run: |
          python -m pip install --user buildozer cython

      - name: Cache buildozer global
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          python -m buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: irmapi-apk
          path: bin/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls bin/*.apk | head -1)
          echo "APK: $APK"
          TAG="v1.3.0-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" "$APK" \
            --title "IRmAPI $TAG" \
            --notes "自动构建 APK — 豆包/DeepSeek/千问 三通道一键登录，词元自由" \
            --prerelease
          echo "Release tag: $TAG"
